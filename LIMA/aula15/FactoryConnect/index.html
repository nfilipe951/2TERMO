<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">

    
    <title>Factory Connect</title>
</head>
<body>
 <main class="container py-4">
    <section class="p-4 rounded-4 text-white" style="background: linear-gradient(120deg, #10415a, #176d91);">
      <header>
        <h1 class="h3 mb-3">FactoryConnect - Portal de Gestão Industrial</h1>
        <p class="mb-4">
          Uma indústria está digitalizando seus processos e contratou a DevSolutions para criar uma interface Web responsiva que centralize informações das principais áreas.
        </p>
      </header>

      <section class="row g-4" aria-label="Áreas da Indústria">
        <article class="col-12 col-md-6 col-lg-4">
          <p class="p-3 m-0 text-center rounded-3 bg-primary bg-opacity-25 border">
            <button type="button" class="btn bg-white bg-opacity-25 text-white border">Produção</button>
          </p>
        </article>

        <article class="col-12 col-md-6 col-lg-4">
          <p class="p-3 m-0 text-center rounded-3 bg-primary bg-opacity-25 border">
            <button type="button" class="btn bg-white bg-opacity-25 text-white border">Manutenção</button>
          </p>
        </article>

        <article class="col-12 col-md-6 col-lg-4">
          <p class="p-3 m-0 text-center rounded-3 bg-primary bg-opacity-25 border">
            <button type="button" class="btn bg-white bg-opacity-25 text-white border">Qualidade</button>
          </p>
        </article>

        <article class="col-12 col-md-6 col-lg-4">
          <p class="p-3 m-0 text-center rounded-3 bg-primary bg-opacity-25 border">
            <button type="button" class="btn bg-white bg-opacity-25 text-white border">Logística</button>
          </p>
        </article>

        <article class="col-12 col-md-6 col-lg-4">
          <p class="p-3 m-0 text-center rounded-3 bg-primary bg-opacity-25 border">
            <button type="button" class="btn bg-white bg-opacity-25 text-white border">Segurança</button>
          </p>
        </article>

        <article class="col-12 col-md-6 col-lg-4">
          <p class="p-3 m-0 text-center rounded-3 bg-primary bg-opacity-25 border">
            <button type="button" class="btn bg-white bg-opacity-25 text-white border">Tecnologia</button>
          </p>
        </article>
      </section>

      
    </section>
  </main>


</body>
</html>
